                <ul>

                <section class="tab-content active" id="tab-idioma">

                        <option value="English">English</option>

                <section class="tab-content" id="tab-sonido">
                    <h1 class="tab-title">SONIDO</h1>
                    <hr>
                    <label for="volumen">Volumen General</label>
                    <input type="range" id="volumen" min="0" max="100">
                </section>

                <section class="tab-content" id="tab-controles">
                    <h1 class="tab-title">CONTROLES</h1>
                    <hr>
                    <p>Moverse: WASD / Flechas</p>
                    <p>Pausa: ESC</p>
                </section>
